<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>SyncFlow - Login</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Icons & Font -->
    <link rel="stylesheet" href="https://unpkg.com/phosphor-icons@1.4.2/src/css/icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <!-- Tema Geral -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body {
            background: linear-gradient(135deg, #6e56cf, #202940);
            font-family: "Lato", sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 400px;
            background: #ffffff;
            border-radius: 14px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            animation: fadeIn .6s ease;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(20px);}
            to   {opacity: 1; transform: translateY(0);}
        }

        .login-logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-logo h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1px;
            color: #4c7cfc;
        }

        .login-input {
            position: relative;
            margin-bottom: 18px;
        }

        .login-input input {
            width: 100%;
            height: 45px;
            padding-left: 45px;
            padding-right: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            transition: .2s;
        }

        .login-input input:focus {
            border-color: #4c7cfc;
            box-shadow: 0 0 0 3px rgba(76,124,252,0.25);
        }

        .login-input i {
            position: absolute;
            left: 14px;
            top: 11px;
            font-size: 22px;
            color: #777;
        }

        .btn-login {
            width: 100%;
            background: #4c7cfc;
            color: white;
            font-weight: 600;
            height: 47px;
            border-radius: 10px;
            border: none;
            transition: .25s;
            margin-top: 5px;
        }

        .btn-login:hover {
            background: #3b66d8;
            transform: translateY(-1px);
        }

        .forgot-link {
            text-align: center;
            display: block;
            margin-top: 12px;
            font-size: 14px;
            color: #4c7cfc;
            text-decoration: none;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .alert {
            font-size: 14px;
            padding: 8px 12px;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>

</head>

<body>

<div class="login-container">

    <!-- LOGO / TÍTULO -->
    <div class="text-center" style="padding: 20px 0;">            
        <img src="{{ url_for('static', filename='img/logo09.png') }}"
            alt="TrackFlow"
            style="max-width:200px; display:block; margin:0 auto 5px;">     
            <small style="color:#616161">Sistema de Gestão de Programas, Eventos e Frequência</small>    
    </div>

    <!-- FLASH MESSAGES -->
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                {{ message }}                
            </div>
        {% endfor %}
    {% endif %}
    {% endwith %}

    <!-- FORM LOGIN -->
    <form method="POST">

        <div class="login-input">
            <i class="ph ph-at"></i>
            <input type="email" name="email" placeholder="E-mail" required>
        </div>

        <div class="login-input">
            <i class="ph ph-lock"></i>
            <input type="password" name="senha" placeholder="Senha" required>
        </div>

        <button class="btn-login">Entrar</button>
    </form>

</div>

</body>
</html>
