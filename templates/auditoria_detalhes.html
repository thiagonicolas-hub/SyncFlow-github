{% extends "layout.html" %}
{% block conteudo %}

<h2 class="mb-3">Histórico de Auditoria – {{ parceiro.nome }}</h2>
<p><strong>CNPJ:</strong> {{ parceiro.cnpj }}</p>

<div class="card mt-3">
    <div class="card-body">

        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>Data/Hora</th>
                    <th>Usuário</th>
                    <th>Ação</th>
                    <th>Detalhes</th>
                    <th>IP</th>
                </tr>
            </thead>

            <tbody>
                {% for h in historico %}
                <tr>
                    <td>{{ h.data_hora }}</td>
                    <td>{{ h.usuario_nome }}</td>
                    <td>{{ h.acao }}</td>
                    <td>{{ h.detalhes }}</td>
                    <td>{{ h.ip }}</td>
                </tr>
                {% endfor %}
            </tbody>

        </table>

    </div>
</div>
{% endblock %}
