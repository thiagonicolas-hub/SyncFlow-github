{% extends "layout.html" %}
{% block content %}

<h3>Parceiros</h3>
<table class="table table-striped">
    <thead>
        <tr>
            <th>Parceiro</th>
            <th>Ação</th>
        </tr>
    </thead>
    <tbody>
        {% for p in parceiros %}
        <tr>
            <td>{{ p.nome }}</td>
            <td>
                <a href="{{ url_for('suporte_assumir', parceiro_id=p.id) }}"
                   class="btn btn-sm btn-danger">
                    Assumir
                </a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
